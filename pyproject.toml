[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "e1r-decoder"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["numpy>=1.23", "dpkt>=1.9.8"]

[project.optional-dependencies]
test = ["pytest>=7"]
viewer = [
    "open3d==0.18.0; sys_platform == 'linux' and (platform_machine == 'aarch64' or platform_machine == 'arm64')",
    "numpy<2; sys_platform == 'linux' and (platform_machine == 'aarch64' or platform_machine == 'arm64')",
    "open3d>=0.19,<0.20; sys_platform != 'linux' or (platform_machine != 'aarch64' and platform_machine != 'arm64')",
]

[tool.setuptools.packages.find]
include = ["e1r_decoder*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
